name: Update GTFS

on:
  schedule:
    - cron: '0 3 * * 1'  # ogni lunedì alle 3:00 UTC
  workflow_dispatch:       # eseguibile anche manualmente

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download GTFS GTT
        run: |
          curl -L "https://mobilitydatabase.org/feeds/mdb-2687/download" -o gtt_gtfs.zip || \
          curl -L "https://storage.googleapis.com/storage/v1/b/mdb-latest/o/eu-italy-gruppo-torinese-trasporti-gtfs-2687.zip?alt=media" -o gtt_gtfs.zip
          unzip -o gtt_gtfs.zip -d gtt_gtfs

      - name: Build gtfs-data.json
        run: node build-gtfs.js
        env:
          GTFS_DIR: gtt_gtfs

      - name: Copy to docs
        run: cp gtfs-data.json docs/gtfs-data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/gtfs-data.json
          git diff --staged --quiet || git commit -m "auto: aggiorna gtfs-data.json"
          git push
