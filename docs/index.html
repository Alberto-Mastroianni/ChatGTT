<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
        <meta name="author" content="Matteo Licciardino e Alberto Mastroianni">
        <meta name="description" content="Chatbot della GTT in HTML, CSS e JS">
        <meta name="keywords" content="ChatGTT">
        
        <title>ChatGTT</title>

        <!-- Favicon standard per i computer -->
        <link rel="icon" href="img/favicon.png" type="image/png">
        <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

        <!-- Meta tag per webapp mobile -->
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="application-name" content="ChatGTT">

        <!-- Per dispositivi iOS (Apple) -->
        <link rel="apple-touch-icon" href="img/favicon.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="apple-mobile-web-app-title" content="ChatGTT">

        <!-- Per dispositivi Android (Collega il file manifest) -->
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#ffffff">

        <!-- Per Windows -->
        <meta name="msapplication-TileImage" href="img/favicon.png">
        <meta name="msapplication-TileColor" content="#ffffff">
        <meta name="msapplication-tap-highlight" content="no">

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="language-selector.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    </head>

    <body>
        <div class="rotate-message">
            <p>Ruota lo schermo per una migliore esperienza</p>
        </div>

        <div class="chat-container">

            <div class="chat-header">
                <button class="btn-cerchio">?</button>
                <div class="header-content"> 
                    <img src="./img/gtt_new.png" alt="immagine della ChatGTT">
                </div>
            </div>
            
            <!-- Selettore lingua posizionato fuori dall'header -->
            <div class="language-selector">
                <button class="language-btn" onclick="toggleLanguageDropdown()" aria-label="Seleziona lingua">
                    <img class="flag" id="currentFlag" src="https://flagcdn.com/w40/it.png" alt="IT">
                    <span class="arrow">▼</span>
                </button>
                <div class="language-options" id="languageOptions">
                    <div class="language-option" onclick="selectLanguage('it')">
                        <img class="flag" src="https://flagcdn.com/w40/it.png" alt="IT">
                        <span>Italiano</span>
                    </div>
                    <div class="language-option" onclick="selectLanguage('en')">
                        <img class="flag" src="https://flagcdn.com/w40/gb.png" alt="GB">
                        <span>English</span>
                    </div>
                    <div class="language-option" onclick="selectLanguage('es')">
                        <img class="flag" src="https://flagcdn.com/w40/es.png" alt="ES">
                        <span>Español</span>
                    </div>
                    <div class="language-option" onclick="selectLanguage('fr')">
                        <img class="flag" src="https://flagcdn.com/w40/fr.png" alt="FR">
                        <span>Français</span>
                    </div>
                    <div class="language-option" onclick="selectLanguage('de')">
                        <img class="flag" src="https://flagcdn.com/w40/de.png" alt="DE">
                        <span>Deutsch</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-body" id="chatBody">
                <!-- I messaggi di chat verranno inseriti qui -->
            </div>

            <div class="chat-input">
                <input type="text" placeholder="Messaggio ChatGTT" aria-label="Inserisci un messaggio">
                <button aria-label="Invia messaggio"><span class="material-symbols-outlined">send</span></button>
            </div>

            <!-- Aggiunto il pulsante Clear Text con aria-label -->
            <button id="clear" aria-label="Cancella messaggi"><span class="material-symbols-outlined" id="elimina">delete</span></button>
        </div>

        <div class="confirmation-box" id="confirmationBox" role="dialog" aria-labelledby="dialogTitle">
            <div class="confirmation-content">
                <p id="dialogTitle">Sei sicuro di voler cancellare i messaggi?</p>
                <button id="agree" aria-label="Conferma cancellazione"><span class="material-symbols-outlined" id="conferma">done</span></button>
                <button id="decline" aria-label="Annulla cancellazione"><span class="material-symbols-outlined" id="annulla">close</span></button>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="config.js"></script>
        <script src="translations.js"></script>
        <script src="script.js"></script>
        <script src="openai.js"></script>
    </body>
</html>
